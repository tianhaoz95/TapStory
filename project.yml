name: TapStory
options:
  bundleIdPrefix: com.tapstory
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Baked in directly (not sensitive -- it's the public Apple Developer
    # team identifier, visible in any provisioning profile). Left empty,
    # Debug builds can't resolve a signing identity for a real device, and
    # xcodegen also writes it into PBXProject's TargetAttributes, which a
    # `DEVELOPMENT_TEAM=...` override on the xcodebuild command line does
    # not reach.
    DEVELOPMENT_TEAM: "68CTFST8W2"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false

targets:
  TapStory:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/TapStory
      - path: Shared/WatchConnectivity
    resources:
      # Note: this does NOT preserve the Stories/Vocab/Music/Audio
      # subfolder structure inside the built app -- Xcode's Copy Bundle
      # Resources phase flattens grouped resources to the bundle's top
      # level. Code that looks up these files (BundledLibrary,
      # MediaResolver) is written to match that flat reality rather than
      # assume subdirectories exist. The subfolders remain purely for our
      # own organization on disk.
      - path: App/TapStory/Resources/BundledContent
    dependencies:
      - target: TapStoryWatch
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStory
        PRODUCT_NAME: TapStory
        INFOPLIST_FILE: App/TapStory/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TapStory/TapStory.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      # Automatic signing's "purpose" (development vs distribution)
      # resolution turned out to be unreliable for `xcodebuild archive` on
      # the CLI regardless of DEVELOPMENT_TEAM/CODE_SIGN_IDENTITY overrides
      # -- it kept deciding "development" even with a Distribution identity
      # and team baked in, which then hard-conflicts with any explicit
      # Distribution identity override ("automatically signed for
      # development, but a conflicting code signing identity ... has been
      # manually specified"). Manual signing for Release sidesteps that
      # ambiguity entirely: exact certificate + exact provisioning profile,
      # nothing left for Xcode to infer. The two profiles referenced below
      # were created once via the App Store Connect API (IOS_APP_STORE
      # type, tied to the Apple Distribution: HEJI TECHNOLOGY LLC
      # certificate) and now persist on Apple's server.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TapStory App Store Distribution - TapStory v2"
    info:
      path: App/TapStory/Info.plist
      properties:
        # Must reference the build settings, not literals. xcodegen
        # otherwise writes CFBundleVersion=1 / CFBundleShortVersionString=1.0
        # into the plist, which silently overrides MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION -- including the per-run build number CI
        # passes as CURRENT_PROJECT_VERSION, so every TestFlight upload
        # would arrive as build "1" and be rejected as a duplicate.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: TapStory
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NFCReaderUsageDescription: "TapStory reads the tag on your toy or card to start a story, song, or learning activity."
        NSMicrophoneUsageDescription: "TapStory lets parents record their own voice for custom stories and vocabulary cards."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/TapStory/TapStory.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          # "NDEF" is a long-deprecated entitlement value that current App
          # Store Connect validation rejects outright ("NDEF is disallowed",
          # ITMS-90778) regardless of deployment target -- confirmed via
          # Apple Developer Forum threads on this exact error. "TAG" is the
          # modern replacement and fully covers NFCNDEFReaderSession
          # scanning/writing (this app never uses NFCTagReaderSession
          # directly), so no code changes are needed, just this entitlement.
          - TAG
    scheme:
      testTargets:
        - TapStoryTests
      gatherCoverageData: true

  TapStoryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TapStoryTests
    dependencies:
      - target: TapStory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStoryTests
        GENERATE_INFOPLIST_FILE: true

  # Watch companion: a remote control for the parent (toggle Screen
  # Display, stop playback, or start a saved story) that never touches
  # the phone a toddler is holding. Modern single-target watch app (no
  # separate WatchKit Extension target needed) embedded into TapStory via
  # the `dependencies: embed` above. See Shared/WatchConnectivity for the
  # wire protocol both targets share.
  TapStoryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App/TapStoryWatch
      - path: Shared/WatchConnectivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStory.watchkitapp
        PRODUCT_NAME: TapStoryWatch
        INFOPLIST_FILE: App/TapStoryWatch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # MUST stay YES. The watch app reaches the device embedded inside
        # TapStory.app (via the `dependencies: embed` above), so installing
        # it standalone as well puts a second .app in the archive's
        # Products/Applications/. Xcode then can't tell which is the primary
        # application, silently omits ApplicationProperties from the
        # archive's Info.plist, and -exportArchive fails with a completely
        # unrelated-looking "exportOptionsPlist error for key \"method\""
        # (the archive has no detectable platform, so every distribution
        # method rejects it and the valid-method set is empty).
        SKIP_INSTALL: YES
      # See the matching comment on the TapStory target -- manual signing
      # for Release avoids automatic signing's unreliable purpose
      # resolution via the CLI.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "TapStory App Store Distribution - TapStoryWatch v2"
    info:
      path: App/TapStoryWatch/Info.plist
      properties:
        # See the matching comment on the TapStory target -- the watch app's
        # version must track the phone app's exactly or the upload is
        # rejected for a version mismatch between the paired bundles.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: TapStory
        WKApplication: true
        UIDeviceFamily:
          - 4
        WKCompanionAppBundleIdentifier: com.tapstory.TapStory
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKRunsIndependentlyOfCompanionApp: false
    scheme: {}
