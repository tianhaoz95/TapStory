name: Release to TestFlight

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: testflight-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import code-signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # A fresh, throwaway keychain for this run only -- never touches
          # (or persists alongside) whatever's in the runner's own login
          # keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # shellcheck disable=SC2207
          EXISTING_KEYCHAINS=($(security list-keychains -d user | sed 's/"//g'))
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          rm -f "$CERT_PATH"

      - name: Import App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/private_keys"
          KEY_FILE="AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/private_keys/$KEY_FILE"
          # altool auto-discovers keys from ~/private_keys; xcodebuild needs
          # an explicit path, provided separately below.
          cp "$RUNNER_TEMP/private_keys/$KEY_FILE" "$HOME/private_keys/$KEY_FILE"

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # No explicit -sdk here -- TapStory embeds the TapStoryWatch
          # companion target, and an explicit -sdk forces that SDK onto the
          # entire target graph, silently breaking the embedded watch
          # target's own platform. See README.md / CLAUDE.md.
          # Do NOT pass CODE_SIGN_STYLE here. Release is deliberately set to
          # Manual signing in project.yml (see the comment there); overriding
          # it back to Automatic reintroduces the development-vs-distribution
          # purpose ambiguity this project already got burned by.
          # -allowProvisioningUpdates fetches the two named App Store profiles
          # from App Store Connect using the API key, so a fresh runner with
          # no cached profiles works.
          xcodebuild archive \
            -project TapStory.xcodeproj \
            -scheme TapStory \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TapStory.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          # Guard: the archive must declare ApplicationProperties, which Xcode
          # only writes when exactly one app lands in Products/Applications.
          # If the embedded watch target ever regains SKIP_INSTALL=NO it shows
          # up as a second app, the key silently vanishes, and -exportArchive
          # then fails with a misleading 'exportOptionsPlist error for key
          # "method"'. Fail loudly here instead.
          if ! /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleIdentifier" \
               "$RUNNER_TEMP/TapStory.xcarchive/Info.plist" >/dev/null 2>&1; then
            echo "::error::Archive is missing ApplicationProperties. Products/Applications contains:"
            ls -1 "$RUNNER_TEMP/TapStory.xcarchive/Products/Applications" || true
            exit 1
          fi

      - name: Export & upload to TestFlight
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # "app-store" + a separate `xcrun altool --upload-app` step is
          # the classic recipe, but this Xcode version renamed the method
          # to "app-store-connect" (confirmed via `xcodebuild -help`;
          # "app-store" is now rejected outright, not just deprecated) and
          # added a `destination: upload` key that makes -exportArchive
          # itself perform the upload -- no separate altool step needed.
          #
          # signingStyle must be manual and every bundle in the archive needs
          # an explicit profile here, matching the PROVISIONING_PROFILE_SPECIFIER
          # values in project.yml. Leaving it automatic makes the export ask
          # Xcode to re-resolve signing and it lands back on development.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tapstory.TapStory</key>
              <string>TapStory App Store Distribution - TapStory v2</string>
              <key>com.tapstory.TapStory.watchkitapp</key>
              <string>TapStory App Store Distribution - TapStoryWatch v2</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TapStory.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean up signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$HOME/private_keys"
