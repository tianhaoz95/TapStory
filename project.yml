name: TapStory
options:
  bundleIdPrefix: com.tapstory
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false

targets:
  TapStory:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App/TapStory
      - path: Shared/WatchConnectivity
    resources:
      # Note: this does NOT preserve the Stories/Vocab/Music/Audio
      # subfolder structure inside the built app -- Xcode's Copy Bundle
      # Resources phase flattens grouped resources to the bundle's top
      # level. Code that looks up these files (BundledLibrary,
      # MediaResolver) is written to match that flat reality rather than
      # assume subdirectories exist. The subfolders remain purely for our
      # own organization on disk.
      - path: App/TapStory/Resources/BundledContent
    dependencies:
      - target: TapStoryWatch
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStory
        PRODUCT_NAME: TapStory
        INFOPLIST_FILE: App/TapStory/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TapStory/TapStory.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/TapStory/Info.plist
      properties:
        CFBundleDisplayName: TapStory
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NFCReaderUsageDescription: "TapStory reads the tag on your toy or card to start a story, song, or learning activity."
        NSMicrophoneUsageDescription: "TapStory lets parents record their own voice for custom stories and vocabulary cards."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/TapStory/TapStory.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
    scheme:
      testTargets:
        - TapStoryTests
      gatherCoverageData: true

  TapStoryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TapStoryTests
    dependencies:
      - target: TapStory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStoryTests
        GENERATE_INFOPLIST_FILE: true

  # Watch companion: a remote control for the parent (toggle Screen
  # Display, stop playback, or start a saved story) that never touches
  # the phone a toddler is holding. Modern single-target watch app (no
  # separate WatchKit Extension target needed) embedded into TapStory via
  # the `dependencies: embed` above. See Shared/WatchConnectivity for the
  # wire protocol both targets share.
  TapStoryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App/TapStoryWatch
      - path: Shared/WatchConnectivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapstory.TapStory.watchkitapp
        PRODUCT_NAME: TapStoryWatch
        INFOPLIST_FILE: App/TapStoryWatch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO
    info:
      path: App/TapStoryWatch/Info.plist
      properties:
        CFBundleDisplayName: TapStory
        WKApplication: true
        UIDeviceFamily:
          - 4
        WKCompanionAppBundleIdentifier: com.tapstory.TapStory
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKRunsIndependentlyOfCompanionApp: false
    scheme: {}
